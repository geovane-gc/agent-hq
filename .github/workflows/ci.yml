name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The desktop app's Electron binary isn't needed to type-check, build or run the core.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # engines.node is ">=22.18": test the 22 LTS line everywhere, and the current LTS on Linux.
        node: [22.x]
        include:
          - os: ubuntu-latest
            node: 24.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # node-pty comes prebuilt (@lydell/node-pty-<platform>) and Rollup is the WebAssembly build: no compilers needed.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  smoke:
    name: smoke (core + fake Claude Code)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: npm run smoke
        run: npm run smoke
        env:
          SMOKE_DIR: ${{ runner.temp }}/smoke
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/data/offices.json
          if-no-files-found: ignore
          retention-days: 7
